# SPDX-License-Identifier: MIT
#
# Generic shell linter: shellcheck and the rules of ncmake over every tracked
# shell script.
# https://github.com/ernolf/ncmake
#
# There is no shellcheck template in nextcloud/.github, so this is ncmake's own.
# It makes no assumption about where a repository keeps its scripts: the file
# list comes from git and a file qualifies by extension (*.sh, *.bash) or by its
# shebang, which is what covers an extensionless command such as sbin/dcm-cli.
#
# The job runs make lint-shell of the ncmake lint module, the same target a
# maintainer runs locally, so both give the same result: the files it collects,
# the shellcheck version and the rules that fail live in that module only.
# Beside shellcheck, which reads the repository's .shellcheckrc, the target
# applies the rule unset-local: in a script under set -u, every name local or
# declare declares gets a value, so no path that reads it first aborts with
# "unbound variable". The ncmake bootstrap is fetched into the runner's temp
# directory, so the repository needs none of its own. Only the step that fetches
# the ncmake modules sees a token.
#
# Every finding fails the job. A repository with no shell script at all passes
# instead of failing, so the workflow can be installed anywhere without becoming
# a permanent red cross. The job keeps the name shellcheck, which a branch
# protection names as its required check. The report goes to the job summary.

name: Lint shell

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-shell-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NCMAKE_BOOTSTRAP: https://raw.githubusercontent.com/ernolf/ncmake/main/bootstrap/GNUmakefile

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch ncmake
        env:
          # make dev-init lists the ncmake modules through the GitHub API, which
          # answers an anonymous call from a shared hosted runner with 403 every
          # so often.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ncmake-bootstrap.mk" "$NCMAKE_BOOTSTRAP"
          make -f "$RUNNER_TEMP/ncmake-bootstrap.mk" --no-print-directory dev-init

      - name: Run make lint-shell
        run: |
          out="$RUNNER_TEMP/lint-shell.txt"
          rc=0
          make -f "$RUNNER_TEMP/ncmake-bootstrap.mk" --no-print-directory lint-shell > "$out" || rc=$?
          cat "$out"
          {
            echo '## lint-shell'
            echo
            echo '```text'
            cat "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if test "$rc" != 0; then
            echo "::error::make lint-shell failed: a finding of shellcheck or of unset-local, or a run that could not be carried out."
            exit 1
          fi
